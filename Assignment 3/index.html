
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
</head>

<body>

    <div id="form">

        <h3>Student Marks Calculator</h3>

        <label class="input">Enter Name:</label><br>
        <input type="text" id="name" placeholder="Enter your name here.."/><br>

        <label class="input">Enter Roll No:</label><br>
        <input type="number" id="roll" placeholder="Enter your Roll no here.."/><br>

        <label class="input">Enter Marks of Data Structures:</label><br>
        <input type="text" id="sub1" placeholder="Out of 100"/><br>

        <label class="input">Enter Marks of Operating System:</label><br>
        <input type="text" id="sub2" placeholder="Out of 100"/><br>

        <label class="input">Enter Marks of Database Management System:</label><br>
        <input type="text" id="sub3" placeholder="Out of 100"/><br>

        <label class="input">Enter Marks of Javascript:</label><br>
        <input type="text" id="sub4" placeholder="Out of 100"/><br>

        <button class="click" onclick="Submit()">Submit</button>

        <button class="click" onclick="calculateTotal()">Total</button>

        <button class="click" onclick="calculatePercent()">Percentage</button>

        <p id="demo"></p>

        
        <div id="result"></div>


        <script>

            function calculateTotal()
            {
                let s1 = Number(document.getElementById("sub1").value);
                let s2 = Number(document.getElementById("sub2").value);
                let s3 = Number(document.getElementById("sub3").value);
                let s4 = Number(document.getElementById("sub4").value);

                let Total = s1 + s2 + s3 + s4;

                alert("Total is:" + Total);

                document.getElementById("demo").innerHTML =
                    "Total Marks=" + Total;
            }


            function calculatePercent()
            {
                let s1 = Number(document.getElementById("sub1").value);
                let s2 = Number(document.getElementById("sub2").value);
                let s3 = Number(document.getElementById("sub3").value);
                let s4 = Number(document.getElementById("sub4").value);

                let Total = s1 + s2 + s3 + s4;

                let percent = (Total / 400) * 100;

                alert("Percentage:" + percent);

                document.getElementById("demo").innerHTML =
                    "Percentage=" + percent;
            }


            function Submit()
            {
               

                let name = document.getElementById("name").value;
                let roll = document.getElementById("roll").value;

                let s1 = Number(document.getElementById("sub1").value);
                let s2 = Number(document.getElementById("sub2").value);
                let s3 = Number(document.getElementById("sub3").value);
                let s4 = Number(document.getElementById("sub4").value);

                

                let total = s1 + s2 + s3 + s4;

                
                let percentage = (total / 400) * 100;


                

                document.getElementById("result").innerHTML = `

                    <table border="1">

                        <tr>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Data Structures</th>
                            <th>Operating System</th>
                            <th>DBMS</th>
                            <th>Javascript</th>
                            <th>Total</th>
                            <th>Percentage</th>
                        </tr>

                        <tr>
                            <td>${name}</td>
                            <td>${roll}</td>
                            <td>${s1}</td>
                            <td>${s2}</td>
                            <td>${s3}</td>
                            <td>${s4}</td>
                            <td>${total}</td>
                            <td>${percentage}%</td>
                        </tr>

                    </table>

                `

                alert("Your Form Has Submitted SuccessFully!");
            }

        </script>

    </div>

</body>
</html>
```
